      <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    </noscript>
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem("csu_mitra_dark_mode") === "true";
          if (isDark || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches && localStorage.getItem("csu_mitra_dark_mode") === null)) {
            document.documentElement.classList.add("dark");
          }
        } catch(e) {}
      })();
    </script>

  <body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 antialiased selection:bg-amber-500 selection:text-white">
