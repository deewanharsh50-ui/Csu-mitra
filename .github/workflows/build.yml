name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: |
          sudo npm install --global @bubblewrap/cli

      - name: Configure and Build APK
        run: |
          mkdir -p ~/.bubblewrap
          cat << 'EOF' > ~/.bubblewrap/config.json
          {
            "jdkPath": "${{ env.JAVA_HOME }}",
            "androidSdkPath": "${{ env.ANDROID_HOME }}"
          }
          EOF
          mkdir pwa-app && cd pwa-app
          yes "" | bubblewrap init --manifest="https://ais-pre-3uoo7exolfbxhw43mwoy45-934728614081.asia-southeast1.run.app/manifest.json" --skipPush
          yes "" | bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSU-Mitra-APK
          path: pwa-app/*.apk
          
