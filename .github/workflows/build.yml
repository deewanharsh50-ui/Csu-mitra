name: Offline Native APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node & JDK
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Dist & Cordova APK
        run: |
          # 1. Install dependencies without peer conflict
          npm install --legacy-peer-deps

          # 2. Build Vite with relative base path (fixes blank screen on phone)
          npx vite build --base=./

          # 3. Create Cordova project with clean package ID
          npm install -g cordova
          cordova create csuapp com.csuapp.mitra "CSU Mitra"
          cd csuapp
          cordova platform add android

          # 4. Copy Vite dist files to Cordova www
          rm -rf www/*
          cp -r ../dist/* www/

          # 5. Offline app display settings
          sed -i '/<\/widget>/i \
              <preference name="DisallowOverscroll" value="true" />\
              <preference name="KeepRunning" value="true" />' config.xml

          # 6. Build Debug APK
          cordova build android

      - name: Upload Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: CSU-Mitra-Offline-APK
          path: csuapp/platforms/android/app/build/outputs/apk/debug/*.apk
          
