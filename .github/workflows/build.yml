name: Live Auto-Update APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node & Java
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build APK via Cordova
        run: |
          npm install -g cordova
          cordova create csuapp com.csuapp.mitra "CSU Mitra"
          cd csuapp
          cordova platform add android
          
          # URL injection
          sed -i 's|<content src="index.html" />|<content src="https://ais-dev-3uoo7exolfbxhw43mwoy45-934728614081.asia-southeast1.run.app" />|' config.xml
          sed -i 's|<access origin="\*" />|<access origin="*" /><allow-navigation href="*" />|' config.xml
          
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSU-Mitra-Final
          path: csuapp/platforms/android/app/build/outputs/apk/debug/*.apk
          
