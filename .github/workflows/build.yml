name: Offline Native APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Dist & Cordova APK
        run: |
          # 1. Clean lock file to fix npm native binding bug
          rm -f package-lock.json
          npm install --legacy-peer-deps

          # 2. Build Vite bundle
          npx vite build --base=./

          # 3. Create Cordova project
          npm install -g cordova
          cordova create csuapp com.csuapp.mitra "CSU Mitra"
          cd csuapp
          cordova platform add android

          # 4. Copy dist files to Cordova
          rm -rf www/*
          cp -r ../dist/* www/

          # 5. Native app settings
          sed -i '/<\/widget>/i \
              <preference name="DisallowOverscroll" value="true" />\
              <preference name="KeepRunning" value="true" />' config.xml

          # 6. Compile APK
          cordova build android

      - name: Upload Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: CSU-Mitra-Offline-APK
          path: csuapp/platforms/android/app/build/outputs/apk/debug/*.apk
          
