name: CSU Mitra Pure Offline APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Pure Offline APK
        run: |
          # 1. Frontend bundle compile karein
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npx vite build --base=./

          # 2. Cordova Android App setup
          npm install -g cordova
          cordova create csuapp com.csu.mitra "CSU Mitra"
          cd csuapp
          cordova platform add android

          # 3. Web code ko seedha APK ke andar daalein
          rm -rf www/*
          cp -r ../dist/* www/

          # 4. Pure offline native build
          cordova build android

      - name: Upload Pure APK
        uses: actions/upload-artifact@v4
        with:
          name: CSU-Mitra-Pure-APK
          path: csuapp/platforms/android/app/build/outputs/apk/debug/*.apk
          
