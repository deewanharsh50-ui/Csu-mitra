name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: |
          sudo npm install --global @bubblewrap/cli

      - name: Initialize and Build APK
        run: |
          mkdir pwa-app && cd pwa-app
          bubblewrap init --manifest="https://ais-pre-3uoo7exolfbxhw43mwoy45-934728614081.asia-southeast1.run.app/manifest.json" --skipPush
          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSU-Mitra-APK
          path: pwa-app/*.apk
          
